<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puja Live · OBS subtitles</title>
<!-- A transparent lower third for the video stream. Add it in OBS as a Browser Source, 1920×1080:
       http://127.0.0.1:8090/obs?lang=en          phonetics + English translation
       http://127.0.0.1:8090/obs?lang=zh          Chinese phonetics + Chinese translation
       http://127.0.0.1:8090/obs?lang=bo          Tibetan only
     Add &tib=1 to put the Tibetan script above the phonetics. Hidden while not started, on Break, or when "hidden". -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { height: 100vh; display: flex; align-items: flex-end; justify-content: center; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .box { margin: 0 6vw 5vh; padding: 1.2vh 2.4vw 1.4vh; border-radius: 1.4vh; background: rgba(12,10,8,.72); color: #f3ebe0; text-align: center;
         max-width: 80vw; transition: opacity .5s ease; }
  .box.off { opacity: 0; }
  .bo { font-family: "Jomolhari", "Kailasa", "Noto Serif Tibetan", serif; font-size: 4.2vh; line-height: 1.6; color: #ecd09c; }
  .ph { font-size: 3.6vh; line-height: 1.3; color: #ecd09c; font-weight: 500; }
  .zh .ph, .zh .t { font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
  .t { margin-top: .6vh; font-size: 2.8vh; line-height: 1.35; font-style: italic; color: #e2d8c9; }
  .fill { font-size: .6em; opacity: .65; }
  .dim { opacity: .4; }
</style>
</head>
<body>
<div class="box off" id="box"></div>
<script src="prayers.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), lang = q.get("lang") || "en", tib = q.has("tib") || lang === "bo";
  const box = document.getElementById("box"); box.classList.toggle("zh", lang === "zh");
  const el = (t, c) => { const d = document.createElement(t); d.className = c; return d; };
  let P = null, S = null, pv = null;
  function paint() {
    if (!P || !S) return;
    const l = S.set && !S.test ? P.lines[S.index] : null, sec = l && P.sections[l.sIdx];
    if (!l || sec.card || S.hidden || sec.reveal) { box.classList.add("off"); return; }
    const sc = P.screens[l.scr], L = P.lines.slice(sc.first, sc.last + 1);
    box.replaceChildren();
    L.forEach((x, n) => {
      const dim = S.mode === "line" && sc.first + n !== S.index;
      if (tib && x.bo) { const d = Prayers.fillIn(el("div", "bo" + (dim ? " dim" : "")), x.bo, false, "bo"); box.appendChild(d); }
      const ph = lang === "en" ? x.tr : lang === "zh" ? x.trz : "";
      if (ph) box.appendChild(Prayers.fillIn(el("div", "ph" + (dim ? " dim" : "")), ph, false, lang === "en" ? "tr" : "trz"));
    });
    if (lang !== "bo") {
      const t = [...new Set(L.map((x) => (lang === "zh" ? x.zh : x.en) || "").filter(Boolean))];
      if (t.length) { const d = el("div", "t"); d.textContent = t.join(" "); box.appendChild(d); }
    }
    box.classList.toggle("off", !box.childNodes.length);
  }
  const es = new EventSource("events?id=obs-" + lang);
  es.onmessage = async (e) => {
    const m = JSON.parse(e.data);
    if (m.pv !== pv) { pv = m.pv; P = await Prayers.loadPrayers("prayers.json"); }
    S = m; paint();
  };
})();
</script>
</body>
</html>
